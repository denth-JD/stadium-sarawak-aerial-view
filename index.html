<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Overall Current Aerial View</title>
<style>
/* Layout: one full-viewport stage, 16:9 video centred and scaled to fit, JPK navy/red band like the inspection deck */
:root{
  --bg:#e7ecf3; --card:#ffffff; --line:#d5deea; --navy:#0f2a4d;
  --ink:#0f2440; --mute:#5a6b81; --red:#d7261e;
  --font:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.band{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--navy) 0 82%,var(--red) 82% 100%);flex:none}
header{display:flex;align-items:center;gap:14px;padding:12px 2px;flex:none;min-width:0}
header img{height:42px;width:auto;background:#fff;border-radius:6px;padding:3px 5px;box-shadow:0 1px 4px rgba(15,36,64,.12);flex:none}
.ttl{min-width:0}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-size:clamp(20px,3.2vw,34px);line-height:1.15;font-weight:700;text-wrap:balance}
.sub{font-size:14px;color:var(--mute);margin-top:2px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;aspect-ratio:16/9;max-width:100%;max-height:100%;width:100%;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 6px 28px rgba(15,36,64,.18)}
#frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
#play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,26,48,.25);border:0;cursor:pointer;transition:opacity .3s}
#play span{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#play svg{width:34px;height:34px;margin-left:5px;fill:var(--red)}
#play[hidden]{display:none}
.bar{display:flex;align-items:center;gap:12px;padding-top:10px;flex:none;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--navy);font:600 14px var(--font);cursor:pointer;box-shadow:0 1px 4px rgba(15,36,64,.08)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn:focus-visible,#play:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn[hidden]{display:none}
.meta{margin-left:auto;font-size:13px;color:var(--mute)}
#rot{display:none;font-size:13px;color:var(--mute);width:100%}
@media (orientation:portrait) and (max-width:820px){ #rot{display:block} .meta{margin-left:0} }
@media (max-height:480px){ header{padding:4px 2px} header img{height:30px} .sub,.kicker{display:none} .bar{padding-top:6px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="app">
  <div class="band"></div>
  <header>
    <img src="logo.jpg" alt="Jurutera Perunding Kenyalang logo">
    <div class="ttl">
      <div class="kicker">Naiktaraf dan Baikpulih Stadium Sarawak</div>
      <h1>Overall Current Aerial View</h1>
      <div class="sub">Stadium Sarawak · Drone survey 16 October 2026 · 2 min</div>
    </div>
  </header>
  <div id="stage">
    <div id="frame">
      <video id="v" src="aerial-view.mp4" poster="poster.jpg" playsinline preload="metadata" controls controlsList="nodownload"></video>
      <button id="play" type="button" aria-label="Play video"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></button>
    </div>
  </div>
  <div class="bar">
    <button class="btn primary" id="pp" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path id="ppi" d="M6 4l14 8-14 8z"/></svg><span id="ppt">Play</span></button>
    <button class="btn" id="fs" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Full screen</button>
    <div class="meta">Jurutera Perunding Kenyalang Sdn. Bhd.</div>
    <div id="rot">Tip: turn your phone sideways, then tap Full screen.</div>
  </div>
</div>
<script>
(function(){
  const v=document.getElementById('v'),play=document.getElementById('play'),pp=document.getElementById('pp'),
        ppi=document.getElementById('ppi'),ppt=document.getElementById('ppt'),fs=document.getElementById('fs'),fr=document.getElementById('frame');
  function sync(){const p=v.paused;ppi.setAttribute('d',p?'M6 4l14 8-14 8z':'M6 4h4v16H6zM14 4h4v16h-4z');ppt.textContent=p?'Play':'Pause';
    play.hidden=!(p&&v.currentTime<0.1);}
  function toggle(){if(v.paused){const r=v.play();if(r&&r.catch)r.catch(()=>{});}else v.pause();}
  play.addEventListener('click',toggle);pp.addEventListener('click',toggle);
  ['play','pause','ended','timeupdate'].forEach(e=>v.addEventListener(e,sync));
  function goFS(){
    const d=document,el=fr;
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return;}
    if(el.requestFullscreen){el.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{});}
    else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();}
    else if(v.webkitEnterFullscreen){v.webkitEnterFullscreen();}   /* iPhone */
  }
  fs.addEventListener('click',goFS);
  addEventListener('keydown',e=>{if(e.key===' '||e.key==='k'){e.preventDefault();toggle();}else if(e.key==='f'||e.key==='F')goFS();});
  sync();
})();
</script>
</body>
</html>
